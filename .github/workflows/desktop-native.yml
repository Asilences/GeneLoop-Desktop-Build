name: Desktop native macOS checks
on:
  workflow_dispatch:
    inputs:
      packageMode:
        type: choice
        options: [installers, app, tools, delivery]
        default: installers
  push:
    branches: ['codex/desktop-local-runtime']
    paths:
      - 'apps/desktop/**'
      - 'scenarios/ppt_master/**'
      - '.github/workflows/desktop-native.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scenarios/ppt_master/**'
      - '.github/workflows/desktop-native.yml'
permissions:
  contents: read
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        if: ${{ inputs.packageMode == 'tools' }}
        with:
          python-version: '3.12'
      - run: node -e "if(process.arch !== '${{ matrix.arch }}')process.exit(1)"
      - run: npm ci
      - run: npm run build && npm run check
      - name: Native file permission checks (no model)
        run: npm run smoke:native
      - name: Prepare pinned offline tools
        id: tools
        if: ${{ inputs.packageMode != 'tools' }}
        run: node scripts/prepare-macos-tools.mjs
      - name: Prepare incremental native MCP dependencies
        if: ${{ inputs.packageMode == 'tools' }}
        run: node scripts/prepare-macos-core-tools.mjs && npm run runtime:stage
      - name: Native MCP audit PDF, code, data and file workflows (no model)
        if: ${{ inputs.packageMode == 'tools' }}
        run: |
          node scripts/check-native-workflows.mjs --core
          node scripts/check-native-code.mjs
          desktop-tools-bundle/python/bin/geneloop-python scripts/check-native-ocr.py desktop-tools-bundle
      - name: Native Remotion render and full video decode (no model)
        if: ${{ inputs.packageMode != 'tools' && inputs.packageMode != 'delivery' }}
        run: npm run runtime:stage && npm run smoke:remotion
      - name: Native PPT template and LibreOffice PDF export (no model)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && inputs.packageMode != 'delivery' }}
        run: npm run smoke:ppt
      - name: Native document, table, paper and archive tools (no model)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && inputs.packageMode != 'delivery' }}
        run: node scripts/check-native-scenes.mjs
      - name: Credential scrubbing and cancellation of descendants
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: npm run runtime:stage && node scripts/check-native-process.mjs
      - name: Package on target architecture
        id: package
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ${{ inputs.packageMode == 'app' && 'npm run pack' || 'npm run dist' }}
      - name: Verify ASAR runtime in packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          export ELECTRON_RUN_AS_NODE=1
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          export GENELOOP_NATIVE_RUNTIME="$PWD/$APP/Contents/Resources/geneloop-runtime.asar"
          export GENELOOP_NATIVE_TOOLS="$PWD/$APP/Contents/Resources/geneloop-tools"
          "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-remotion.mjs
      - name: Verify ASAR PPT in packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          export ELECTRON_RUN_AS_NODE=1
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          export GENELOOP_NATIVE_RUNTIME="$PWD/$APP/Contents/Resources/geneloop-runtime.asar"
          export GENELOOP_NATIVE_TOOLS="$PWD/$APP/Contents/Resources/geneloop-tools"
          if [ '${{ inputs.packageMode }}' = 'delivery' ]; then
            "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-workflows.mjs
          else
            "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-ppt.mjs
            "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-scenes.mjs
          fi
      - name: Packaged DSH Agent start, tools and cancellation (no model)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          node scripts/probe-local-runtime.mjs --installed "$APP"
      - name: Record local delivery checksums
        if: ${{ success() && inputs.packageMode == 'delivery' }}
        run: shasum -a 256 release/GeneLoop-Desktop-*.dmg release/GeneLoop-Desktop-*.zip > release/SHA256SUMS-${{ matrix.arch }}.txt
      # Explicit user authorization: private one-day transit, delete after local retrieval.
      # Other modes still do not upload. Never publish a Release.
      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.packageMode == 'delivery' && github.repository == 'Asilences/GeneLoop-Desktop-Build' }}
        with:
          name: geneloop-desktop-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            apps/desktop/release/GeneLoop-Desktop-*.dmg
            apps/desktop/release/GeneLoop-Desktop-*.zip
            apps/desktop/release/SHA256SUMS-*.txt
          retention-days: 1
          compression-level: 0

name: Desktop native macOS checks
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [both, arm64, x64]
        default: both
      timeout:
        type: number
        default: 50
      armTimeout:
        type: number
        default: 13
      intelTimeout:
        type: number
        default: 27
      packageMode:
        type: choice
        options: [installers, app, tools, delivery, dmg-delivery]
        default: installers
concurrency:
  group: private-macos-checks
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.target == 'arm64' && '{"include":[{"os":"macos-15","arch":"arm64"}]}' || inputs.target == 'x64' && '{"include":[{"os":"macos-15-intel","arch":"x64"}]}' || '{"include":[{"os":"macos-15","arch":"arm64"},{"os":"macos-15-intel","arch":"x64"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ fromJSON(matrix.arch == 'x64' && inputs.intelTimeout || inputs.armTimeout) }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        if: ${{ inputs.packageMode == 'tools' }}
        with:
          python-version: '3.12'
      - run: node -e "if(process.arch !== '${{ matrix.arch }}')process.exit(1)"
      - run: npm ci
      - run: npm run build && npm run check
      - name: Native file permission checks (no model)
        run: npm run smoke:native
      - name: Prepare pinned offline tools
        id: tools
        if: ${{ inputs.packageMode != 'tools' }}
        run: node scripts/prepare-macos-tools.mjs
      - name: Prepare incremental native MCP dependencies
        if: ${{ inputs.packageMode == 'tools' }}
        run: node scripts/prepare-macos-core-tools.mjs && npm run runtime:stage
      - name: Native MCP audit PDF, code, data and file workflows (no model)
        if: ${{ inputs.packageMode == 'tools' }}
        run: |
          node scripts/check-native-workflows.mjs --core
          node scripts/check-native-code.mjs
          desktop-tools-bundle/python/bin/geneloop-python scripts/check-native-ocr.py desktop-tools-bundle
      - name: Native Remotion render and full video decode (no model)
        if: ${{ inputs.packageMode != 'tools' && inputs.packageMode != 'delivery' && inputs.packageMode != 'dmg-delivery' }}
        run: npm run runtime:stage && npm run smoke:remotion
      - name: Native PPT template and LibreOffice PDF export (no model)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && inputs.packageMode != 'delivery' && inputs.packageMode != 'dmg-delivery' }}
        run: npm run smoke:ppt
      - name: Native document, table, paper and archive tools (no model)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && inputs.packageMode != 'delivery' && inputs.packageMode != 'dmg-delivery' }}
        run: node scripts/check-native-scenes.mjs
      - name: Credential scrubbing and cancellation of descendants
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: npm run runtime:stage && node scripts/check-native-process.mjs
      - name: Package on target architecture
        id: package
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ${{ (inputs.packageMode == 'app' || inputs.packageMode == 'delivery' || inputs.packageMode == 'dmg-delivery') && 'npm run pack' || 'npm run dist' }}
      - name: Verify ASAR runtime in packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          export ELECTRON_RUN_AS_NODE=1
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          export GENELOOP_NATIVE_RUNTIME="$PWD/$APP/Contents/Resources/geneloop-runtime.asar"
          export GENELOOP_NATIVE_TOOLS="$PWD/$APP/Contents/Resources/geneloop-tools"
          "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-remotion.mjs
      - name: Verify ASAR PPT in packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          export ELECTRON_RUN_AS_NODE=1
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          export GENELOOP_NATIVE_RUNTIME="$PWD/$APP/Contents/Resources/geneloop-runtime.asar"
          export GENELOOP_NATIVE_TOOLS="$PWD/$APP/Contents/Resources/geneloop-tools"
          if [ '${{ inputs.packageMode }}' = 'dmg-delivery' ]; then
            "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-workflows.mjs --core
          elif [ '${{ inputs.packageMode }}' = 'delivery' ]; then
            "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-workflows.mjs
          else
            "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-ppt.mjs
            "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-scenes.mjs
          fi
      - name: Packaged DSH Agent start, tools and cancellation (no model)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          node scripts/probe-local-runtime.mjs --installed "$APP"
      - name: Create and mount drag-to-Applications DMG
        if: ${{ success() && inputs.packageMode == 'dmg-delivery' }}
        run: |
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          npx --no-install electron-builder --mac dmg --${{ matrix.arch }} --prepackaged "$APP" --publish never --config.dmg.format=ULFO --config.dmg.writeUpdateInfo=false
          DMG=$(find release -maxdepth 1 -name 'GeneLoop-Desktop-*.dmg' -type f -print -quit)
          test -n "$DMG"
          hdiutil verify "$DMG"
          MOUNT=$(mktemp -d "$RUNNER_TEMP/geneloop-dmg.XXXXXX")
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true; rmdir "$MOUNT" 2>/dev/null || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          test -d "$MOUNT/GeneLoop Desktop.app"
          test "$(readlink "$MOUNT/Applications")" = /Applications
          cmp "$APP/Contents/Resources/app.asar" "$MOUNT/GeneLoop Desktop.app/Contents/Resources/app.asar"
          cmp "$APP/Contents/Resources/geneloop-runtime.asar" "$MOUNT/GeneLoop Desktop.app/Contents/Resources/geneloop-runtime.asar"
      - name: Record local delivery checksums
        if: ${{ success() && (inputs.packageMode == 'delivery' || inputs.packageMode == 'dmg-delivery') }}
        run: |
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          VERSION=$(node -p "require('./package.json').version")
          if [ '${{ inputs.packageMode }}' = 'dmg-delivery' ]; then
            shasum -a 256 release/GeneLoop-Desktop-*.dmg > release/SHA256SUMS-${{ matrix.arch }}.txt
          else
            ditto -c -k --sequesterRsrc --keepParent "$APP" "release/GeneLoop-Desktop-$VERSION-macOS-${{ matrix.arch }}.zip"
            shasum -a 256 release/GeneLoop-Desktop-*.zip > release/SHA256SUMS-${{ matrix.arch }}.txt
          fi
      # Explicit user authorization: temporary Actions transit, delete after local retrieval.
      # User permits public artifacts in this dedicated build repository (2026-11-06).
      # Other modes still do not upload. Never publish a Release.
      - uses: actions/upload-artifact@v4
        if: ${{ success() && (inputs.packageMode == 'delivery' || inputs.packageMode == 'dmg-delivery') && github.repository == 'Asilences/GeneLoop-Desktop-Build' }}
        with:
          name: geneloop-desktop-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            apps/desktop/release/GeneLoop-Desktop-*.dmg
            apps/desktop/release/GeneLoop-Desktop-*.zip
            apps/desktop/release/SHA256SUMS-*.txt
          retention-days: 1
          compression-level: 0

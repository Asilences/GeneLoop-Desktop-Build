name: Desktop native macOS checks
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [both, arm64, x64]
        default: both
      timeout:
        type: number
        default: 50
      packageMode:
        type: choice
        options: [installers, app]
        default: installers
concurrency:
  group: private-macos-checks
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.target == 'arm64' && '{"include":[{"os":"macos-15","arch":"arm64"}]}' || inputs.target == 'x64' && '{"include":[{"os":"macos-15-intel","arch":"x64"}]}' || '{"include":[{"os":"macos-15","arch":"arm64"},{"os":"macos-15-intel","arch":"x64"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: node -e "if(process.arch !== '${{ matrix.arch }}')process.exit(1)"
      - run: npm ci
      - run: npm run build && npm run check
      - name: Native file permission checks (no model)
        run: npm run smoke:native
      - name: Prepare pinned offline tools
        id: tools
        run: node scripts/prepare-macos-tools.mjs
      - name: Native Remotion render and full video decode (no model)
        run: npm run runtime:stage && npm run smoke:remotion
      - name: Native PPT template and LibreOffice PDF export (no model)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: npm run smoke:ppt
      - name: Credential scrubbing and cancellation of descendants
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: node scripts/check-native-process.mjs
      - name: Package on target architecture
        id: package
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ${{ inputs.packageMode == 'app' && 'npm run pack' || 'npm run dist' }}
      - name: Verify ASAR runtime in packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          export ELECTRON_RUN_AS_NODE=1
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          export GENELOOP_NATIVE_RUNTIME="$PWD/$APP/Contents/Resources/geneloop-runtime.asar"
          export GENELOOP_NATIVE_TOOLS="$PWD/$APP/Contents/Resources/geneloop-tools"
          "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-remotion.mjs
      - name: Verify ASAR PPT in packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          export ELECTRON_RUN_AS_NODE=1
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          export GENELOOP_NATIVE_RUNTIME="$PWD/$APP/Contents/Resources/geneloop-runtime.asar"
          export GENELOOP_NATIVE_TOOLS="$PWD/$APP/Contents/Resources/geneloop-tools"
          "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-native-ppt.mjs
      - name: Packaged DSH Agent start, tools and cancellation (no model)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          node scripts/probe-local-runtime.mjs --installed "$APP"
      # Intentionally no upload-artifact or release publishing step.

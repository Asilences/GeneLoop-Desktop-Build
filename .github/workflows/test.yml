name: Core and MCP checks
on: [push, pull_request]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser for Linux integration checks
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          . /etc/os-release
          apt_dir=$(mktemp -d)
          trap 'rm -f -- "$apt_dir/mirrors.txt" "$apt_dir/ubuntu.sources"; rmdir -- "$apt_dir"' EXIT
          chmod 755 "$apt_dir"
          # The hosted runner's default Ubuntu archive hostnames can fail DNS.
          cat > "$apt_dir/mirrors.txt" <<'EOF'
          https://mirrors.edge.kernel.org/ubuntu/
          https://mirrors.mit.edu/ubuntu/
          EOF
          cat > "$apt_dir/ubuntu.sources" <<EOF
          Types: deb
          URIs: mirror+file:$apt_dir/mirrors.txt
          Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-security
          Components: main
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_dir/ubuntu.sources"
            -o 'Dir::Etc::sourceparts=-'
            -o 'Acquire::https::Timeout=15'
            -o 'Acquire::Retries=0'
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y poppler-utils
          pdfinfo -v
          pdftotext -v
          pdftoppm -v
      - run: npm ci
      - run: npm run setup
      - name: Install pinned local privacy dependencies
        shell: bash
        run: |
          python_path=.venv-sss/$([[ "$RUNNER_OS" == "Windows" ]] && echo Scripts || echo bin)/python
          "$python_path" -m pip install -r requirements-rsi-privacy.txt
          tool_path=$("$python_path" scripts/install-rsi-privacy-tools.py --root "$RUNNER_TEMP/geneloop-privacy-tools")
          echo "SSS_RSI_GITLEAKS=$tool_path" >> "$GITHUB_ENV"
      - name: Install pinned OCR languages for real scan tests
        shell: bash
        run: |
          .venv-sss/$([[ "$RUNNER_OS" == "Windows" ]] && echo Scripts || echo bin)/python scripts/install-pdf-ocr.py --root "$RUNNER_TEMP/geneloop-pdf-ocr"
          echo "GENELOOP_PDF_OCR_ROOT=$RUNNER_TEMP/geneloop-pdf-ocr" >> "$GITHUB_ENV"
      - name: Provide an embedded CJK font for PDF export integration tests
        shell: bash
        run: |
          .venv-sss/$([[ "$RUNNER_OS" == "Windows" ]] && echo Scripts || echo bin)/python -c "import pathlib,pymupdf,sys; pathlib.Path(sys.argv[1]).write_bytes(pymupdf.Font('cjk').buffer)" "$RUNNER_TEMP/geneloop-report-font.ttf"
          echo "HARLESS_REPORT_FONT=$RUNNER_TEMP/geneloop-report-font.ttf" >> "$GITHUB_ENV"
      - run: npm test
      - name: Annotate test failures
        if: failure()
        run: python scripts/annotate-ci-failures.py .local/ci/python-results.xml .local/ci/node-results.xml
      - run: npm run smoke
      - run: npm run motif:check

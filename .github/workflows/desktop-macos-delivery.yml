name: Desktop macOS complete DMG and tool delivery
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [complete, build, repack, real, measure]
        default: complete
      deliveryRun:
        description: Successful small DMG run ID, required only for real acceptance
        type: string
        default: ''
      buildTarget:
        type: choice
        options: [all, arm64, x64]
        default: all
      realTarget:
        type: choice
        options: [all, windows, macos]
        default: all
      testScenes:
        description: Empty means all six; comma-separated scene IDs for a focused regression
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: desktop-macos-delivery-${{ inputs.phase }}-${{ inputs.buildTarget }}
  cancel-in-progress: false
jobs:
  macos:
    # Public standard runners only. Never consume paid private/larger runners.
    if: github.repository == 'Asilences/GeneLoop-Desktop-Build' && !github.event.repository.private && inputs.phase != 'real'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.buildTarget == 'arm64' && '[{"os":"macos-15","arch":"arm64"}]' || inputs.buildTarget == 'x64' && '[{"os":"macos-15-intel","arch":"x64"}]' || '[{"os":"macos-15","arch":"arm64"},{"os":"macos-15-intel","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GENELOOP_DESKTOP_TOOL_PACKS: ${{ inputs.phase == 'complete' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify free runner architecture
        run: node -e "if(process.platform!=='darwin'||process.arch!=='${{ matrix.arch }}')process.exit(1)"
      - run: npm ci
      - run: npm run build
      - name: Prepare complete native tools
        if: inputs.phase != 'repack' && inputs.phase != 'complete'
        env:
          GENELOOP_REUSE_VERIFIED_PYTHON: ${{ inputs.phase == 'measure' && '1' || '0' }}
        run: node scripts/prepare-macos-tools.mjs
      - name: Build native tool archives with a fixed download address
        id: tool_archives
        if: inputs.phase != 'repack' && inputs.phase != 'complete'
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="desktop-tools-darwin-${{ matrix.arch }}-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ '${{ inputs.phase }}' != 'measure' ]; then
            export GENELOOP_TOOL_PACK_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"
          fi
          npm run tools:packs
          node -e "const p=require('./.local/tool-pack-build/preservation.json');if(p.downloadBytes>900000000)throw Error('工具中转超过本轮免费存储预留，保留全部工具并停止')"
      - name: Save only tool archives before any publication can fail
        if: inputs.phase != 'repack' && inputs.phase != 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tool-transit-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            apps/desktop/.local/tool-pack-build/*.7z
            apps/desktop/.local/tool-pack-build/tool-packs.json
            apps/desktop/.local/tool-pack-build/preservation.json
            apps/desktop/.local/tool-pack-build/installer-tools/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Reuse verified published tools for a runtime-only correction
        if: inputs.phase == 'repack'
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_RUN: ${{ inputs.deliveryRun }}
        run: node scripts/reuse-macos-tool-delivery.mjs
      - name: Restore accepted six-scene tools for the complete offline app
        if: inputs.phase == 'complete'
        run: node scripts/prepare-complete-from-release.mjs
      - name: Package desktop app
        run: npm run pack
      - name: Verify scoped tools with the actual desktop host without model calls
        if: inputs.phase == 'measure'
        run: |
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          export GENELOOP_OFFICE_NODE="$PWD/$APP/Contents/MacOS/GeneLoop Desktop"
          export ELECTRON_RUN_AS_NODE=1
          export GENELOOP_NATIVE_RUNTIME="$PWD/runtime-bundle"
          export GENELOOP_NATIVE_TOOLS="$PWD/desktop-tools-bundle"
          export GENELOOP_NATIVE_SOURCE_ROOT="$GENELOOP_NATIVE_TOOLS/source"
          export GENELOOP_NATIVE_SOFFICE="$GENELOOP_NATIVE_TOOLS/libreoffice/Contents/MacOS/soffice"
          "$GENELOOP_NATIVE_TOOLS/python/bin/geneloop-python" -B scripts/check-native-extras.py "$GENELOOP_NATIVE_TOOLS" > .local/scoped-tools-check.json
          "$GENELOOP_OFFICE_NODE" scripts/check-native-ppt.mjs > .local/scoped-ppt-check.json
      - name: Reclaim only this job's reproducible tool staging
        run: |
          if [ '${{ inputs.phase }}' = 'complete' ]; then
            APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
            test -n "$APP"
            echo "GENELOOP_DESKTOP_TOOLS_STAGE=$PWD/$APP/Contents/Resources/geneloop-tools" >> "$GITHUB_ENV"
            node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync,rmSync,lstatSync} from 'node:fs';
          import {resolve,dirname} from 'node:path';
          assert.equal(JSON.parse(readFileSync('.local/complete-copy-proof.json')).allToolsRetained,true);
          const local=resolve('.local');
          for(const name of ['complete-tools','complete-codec']){
            const p=resolve(local,name);assert.equal(dirname(p),local);
            if(existsSync(p)){assert.equal(lstatSync(p).isSymbolicLink(),false);rmSync(p,{recursive:true,force:true});}
          }
          JS
          else
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {existsSync,readFileSync,rmSync} from 'node:fs';
          import {resolve,join,dirname} from 'node:path';
          const root=resolve('.');
          const proof=JSON.parse(readFileSync('.local/tool-pack-build/preservation.json'));
          assert.equal(proof.allToolsRetained,true);
          for(const rel of ['desktop-tools-bundle','.local/macos-tools-'+process.arch]){
            const p=resolve(root,rel);assert.ok(p.startsWith(root+'/')&&p!==root);
            if(existsSync(p))rmSync(p,{recursive:true,force:true});
          }
          JS
          fi
      - name: Verify owner publication of the expected tool archives
        if: inputs.phase != 'measure' && inputs.phase != 'complete'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/await-tool-publication.mjs
      - name: Verify actual packaged public download and native extraction
        if: inputs.phase != 'measure' && inputs.phase != 'complete'
        run: |
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -n "$APP"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-packaged-tool-download.mjs "$APP/Contents/Resources" .local/public-tool-restore
      - name: Create DMG
        run: |
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          npx electron-builder --config electron-builder.config.cjs --mac dmg --${{ matrix.arch }} --prepackaged "$APP" --config.dmg.format=ULFO --publish never
      - name: Verify DMG and collect strictly allowed temporary delivery files
        run: |
          mkdir -p .local/macos-delivery
          DMG=$(find release -maxdepth 1 -name '*macOS-${{ matrix.arch }}.dmg' -type f -print -quit)
          test -n "$DMG"
          hdiutil verify "$DMG"
          MOUNT="$PWD/.local/dmg-verify"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          APP=$(find release -maxdepth 3 -name 'GeneLoop Desktop.app' -type d -print -quit)
          test -L "$MOUNT/Applications"
          cmp "$MOUNT/GeneLoop Desktop.app/Contents/Resources/app.asar" "$APP/Contents/Resources/app.asar"
          if [ '${{ inputs.phase }}' = 'complete' ]; then
            test ! -e "$MOUNT/GeneLoop Desktop.app/Contents/Resources/tool-packs.json"
            test -f "$MOUNT/GeneLoop Desktop.app/Contents/Resources/geneloop-tools/manifest.json"
            INSTALLED="$PWD/.local/complete-install/Applications/GeneLoop Desktop.app"
            mkdir -p "$(dirname "$INSTALLED")"
            ditto "$MOUNT/GeneLoop Desktop.app" "$INSTALLED"
            cmp "$MOUNT/GeneLoop Desktop.app/Contents/Resources/app.asar" "$INSTALLED/Contents/Resources/app.asar"
          fi
          hdiutil detach "$MOUNT"
          cp "$DMG" .local/macos-delivery/
          if [ '${{ inputs.phase }}' = 'complete' ]; then
            export ELECTRON_RUN_AS_NODE=1
            export GENELOOP_OFFICE_NODE="$INSTALLED/Contents/MacOS/GeneLoop Desktop"
            "$GENELOOP_OFFICE_NODE" scripts/check-complete-app.mjs "$INSTALLED/Contents/Resources" .local/complete-native-checks
            "$INSTALLED/Contents/Resources/geneloop-tools/python/bin/geneloop-python" -B scripts/check-native-extras.py "$INSTALLED/Contents/Resources/geneloop-tools" > .local/complete-native-checks/extras.json
            cp .local/complete-{copy-proof,tool-import}.json .local/macos-delivery/
            cp .local/complete-native-checks/{summary.json,extras.json} .local/macos-delivery/
          elif [ '${{ inputs.phase }}' = 'measure' ]; then
            cp .local/tool-pack-build/{tool-packs.json,preservation.json} .local/macos-delivery/
            cp .local/scoped-{tools,ppt}-check.json .local/macos-delivery/
          else
            cp .local/tool-pack-build/{tool-packs.json,preservation.json} .local/macos-delivery/
            cp .local/tool-pack-build/publication-receipt.json .local/macos-delivery/
            cp .local/public-tool-restore/download-receipt.json .local/macos-delivery/
          fi
          cd .local/macos-delivery
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - name: Preserve compact native complete-app diagnostics
        if: always() && inputs.phase == 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-complete-checks-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            apps/desktop/.local/complete-native-checks/*
            apps/desktop/.local/complete-copy-proof.json
            apps/desktop/.local/complete-tool-import.json
          retention-days: 1
          if-no-files-found: warn
      - name: Keep temporary delivery inside the included artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-artifact-space.mjs
      - name: Authorized temporary DMG transit; retrieve and delete
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}-${{ github.run_id }}
          path: apps/desktop/.local/macos-delivery/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Real six-scene acceptance using the actual DMG and downloaded tools
        if: inputs.phase != 'measure' && inputs.phase != 'complete'
        env:
          GENELOOP_TEST_MODEL_KEY: ${{ secrets.GENELOOP_DESKTOP_ACCEPTANCE_KEY }}
          GENELOOP_TEST_PROVIDER: kouri
        run: |
          DMG=$(find .local/macos-delivery -maxdepth 1 -name '*macOS-${{ matrix.arch }}.dmg' -type f -print -quit)
          mkdir -p .local/build-real-mounted
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/.local/build-real-mounted" "$DMG"
          APP="$PWD/.local/build-real-mounted/GeneLoop Desktop.app"
          TOOLS=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(".local/public-tool-restore/download-receipt.json")).tools)')
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-real-six-scenes.mjs "$APP/Contents/Resources" "$TOOLS" .local/real-six-scenes
      - name: Preserve only the synthetic real acceptance summary
        if: always() && inputs.phase != 'measure' && inputs.phase != 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-real-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            apps/desktop/.local/real-six-scenes/summary.json
            apps/desktop/.local/real-six-scenes/preflight-status.json
          retention-days: 1
          if-no-files-found: warn
  real_windows:
    if: github.repository == 'Asilences/GeneLoop-Desktop-Build' && !github.event.repository.private && inputs.phase == 'real' && inputs.realTarget != 'macos'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
    env:
      GENELOOP_DESKTOP_TOOL_PACKS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Reuse the published Windows tool catalog and pinned decoder
        run: |
          @'
          import fs from 'node:fs';
          import {resolve,join} from 'node:path';
          import {prepareInstallerCodec} from './scripts/prepare-installer-codec.mjs';
          const out=resolve('.local/tool-pack-build');fs.mkdirSync(out,{recursive:true});
          fs.copyFileSync('../../.github/desktop-tool-inputs/windows-x64-tool-packs.json',join(out,'tool-packs.json'));
          fs.copyFileSync('../../.github/desktop-tool-inputs/windows-x64-preservation.json',join(out,'preservation.json'));
          await prepareInstallerCodec(resolve('.'),join(out,'installer-tools'));
          '@ | node --input-type=module
      - name: Package the corrected Windows runtime without publishing an installer
        run: npm run pack
      - name: Download and verify the native tool catalog
        run: |
          $env:ELECTRON_RUN_AS_NODE='1'
          $app=Join-Path $PWD 'release/win-unpacked'
          $p=Start-Process -FilePath (Join-Path $app 'GeneLoop Desktop.exe') -ArgumentList @('scripts/check-packaged-tool-download.mjs',(Join-Path $app 'resources'),'.local/windows-real-tools') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput '.local/windows-tool-download.stdout' -RedirectStandardError '.local/windows-tool-download.stderr'
          if($p.ExitCode -ne 0){throw 'Windows 工具下载校验未通过'}
      - name: Simple real six-scene acceptance using Kouri
        env:
          GENELOOP_TEST_MODEL_KEY: ${{ secrets.GENELOOP_DESKTOP_ACCEPTANCE_KEY }}
          GENELOOP_TEST_PROVIDER: kouri
          GENELOOP_TEST_SCENES: ${{ inputs.testScenes }}
        run: |
          $env:ELECTRON_RUN_AS_NODE='1'
          $app=Join-Path $PWD 'release/win-unpacked'
          $tools=(Get-Content .local/windows-real-tools/download-receipt.json -Raw | ConvertFrom-Json).tools
          $p=Start-Process -FilePath (Join-Path $app 'GeneLoop Desktop.exe') -ArgumentList @('scripts/check-real-six-scenes.mjs',(Join-Path $app 'resources'),$tools,'.local/windows-real-six-scenes') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput '.local/windows-real.stdout' -RedirectStandardError '.local/windows-real.stderr'
          if($p.ExitCode -ne 0){throw 'Windows 真实任务简验未全部通过，保留状态摘要'}
      - name: Preserve only synthetic acceptance and download summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-real-win32-x64-${{ github.run_id }}
          path: |
            apps/desktop/.local/windows-real-six-scenes/summary.json
            apps/desktop/.local/windows-real-six-scenes/preflight-status.json
            apps/desktop/.local/windows-real-tools/download-receipt.json
          retention-days: 1
          if-no-files-found: warn
  real:
    if: github.repository == 'Asilences/GeneLoop-Desktop-Build' && !github.event.repository.private && inputs.phase == 'real' && inputs.realTarget != 'windows'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify free standard runner and temporary test credential availability
        env:
          GENELOOP_TEST_MODEL_KEY: ${{ secrets.GENELOOP_DESKTOP_ACCEPTANCE_KEY }}
        run: node -e "if(process.platform!=='darwin'||process.arch!=='${{ matrix.arch }}'||!process.env.GENELOOP_TEST_MODEL_KEY)throw Error('缺少目标原生环境或临时真实测试凭据；不得用模拟结果代替')"
      - name: Retrieve only the authorized temporary delivery artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_RUN: ${{ inputs.deliveryRun }}
        run: |
          [[ "$DELIVERY_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DELIVERY_RUN" --jq .conclusion)" = success
          gh run download "$DELIVERY_RUN" --repo "$GITHUB_REPOSITORY" --name "desktop-macos-${{ matrix.arch }}-$DELIVERY_RUN" --dir .local/real-delivery
          cd .local/real-delivery
          shasum -a 256 --check SHA256SUMS.txt
      - name: Mount the delivered DMG and prepare its tools from the public source
        run: |
          DMG=$(find .local/real-delivery -maxdepth 1 -name '*macOS-${{ matrix.arch }}.dmg' -type f -print -quit)
          test -n "$DMG"
          mkdir -p .local/real-mounted
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/.local/real-mounted" "$DMG"
          APP="$PWD/.local/real-mounted/GeneLoop Desktop.app"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-packaged-tool-download.mjs "$APP/Contents/Resources" .local/real-tool-download
      - name: Real local Agent and all six scenes, cloud model only
        env:
          GENELOOP_TEST_MODEL_KEY: ${{ secrets.GENELOOP_DESKTOP_ACCEPTANCE_KEY }}
          GENELOOP_TEST_PROVIDER: kouri
          GENELOOP_TEST_SCENES: ${{ inputs.testScenes }}
        run: |
          APP="$PWD/.local/real-mounted/GeneLoop Desktop.app"
          TOOLS=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(".local/real-tool-download/download-receipt.json")).tools)')
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/GeneLoop Desktop" scripts/check-real-six-scenes.mjs "$APP/Contents/Resources" "$TOOLS" .local/real-six-scenes
      - name: Preserve only the synthetic acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-real-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            apps/desktop/.local/real-six-scenes/summary.json
            apps/desktop/.local/real-six-scenes/preflight-status.json
            apps/desktop/.local/real-tool-download/download-receipt.json
          retention-days: 1
          if-no-files-found: warn

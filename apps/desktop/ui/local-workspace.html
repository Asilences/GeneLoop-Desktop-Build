<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>本机工作区 · GeneLoop Desktop</title>
  <link rel="stylesheet" href="local-workspace.css">
</head>
<body>
  <main>
    <header><button type="button" id="back">返回工作区</button><img src="../assets/geneloop-spiral.svg" alt=""><span>GeneLoop Desktop</span><span class="pill">本机执行</span></header>
    <h1 id="workspace-name">本机任务</h1>
    <dl>
      <div><dt>读取文件夹</dt><dd id="directory"></dd></div>
      <div><dt>输出位置</dt><dd id="output"></dd></div>
    </dl>
    <details id="history" hidden>
      <summary>历史任务</summary>
      <ul id="history-list"></ul>
    </details>
    <section id="results" aria-label="本机任务结果" aria-live="polite"></section>
    <form id="task">
      <label for="scene">场景</label>
      <select id="scene">
        <option value="files">文件管理</option>
        <option value="data">数据分析</option>
        <option value="paper">论文材料核验</option>
      </select>
      <div id="continuation" hidden><span>正在续接本机会话</span><button type="button" id="reset-context">另起任务</button></div>
      <label for="prompt">任务</label>
      <textarea id="prompt" required placeholder="例如，盘点这个文件夹，找出含指定关键词的文件。"></textarea>
      <p>Agent 与工具在本机运行。发送时，任务描述和必要文件片段会发给云端模型。</p>
      <div class="actions"><span id="status" role="status"></span><button type="button" id="cancel" hidden>停止</button><button type="submit" id="send">运行任务</button></div>
    </form>
  </main>
  <script src="local-workspace.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>GeneLoop Desktop</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header aria-label="桌面菜单栏"><nav id="desktop-menus" aria-label="桌面菜单" hidden><button id="file-menu" aria-haspopup="menu">文件</button><button id="edit-menu" aria-haspopup="menu">编辑</button><button id="view-menu" aria-haspopup="menu">视图</button><button id="help-menu" aria-haspopup="menu">帮助</button></nav></header>
  <main>
    <img class="logo" src="../assets/geneloop-spiral.svg" alt="GeneLoop" width="66" height="104">
    <p class="brand">GeneLoop Desktop</p>
    <h1 id="title">正在连接你的工作区</h1>
    <p id="message" role="status" aria-live="polite">即将打开 GeneLoop。</p>
    <div id="progress" class="progress" aria-label="连接中"></div>
    <button id="retry" hidden>重新连接</button>
    <form id="settings" hidden>
      <label for="server">GeneLoop 服务器地址</label>
      <input id="server" type="url" autocomplete="url" spellcheck="false" required placeholder="https://geneloop.ai/">
      <p class="hint">聊天、场景和文件处理在所连接的服务器执行。</p>
      <p id="error" role="alert"></p>
      <button id="connect" type="submit">连接工作区</button>
    </form>
    <button id="configure" class="text-button" hidden>连接设置</button>
    <p id="version" class="version"></p>
  </main>
  <script src="shell.js"></script>
</body>
</html>

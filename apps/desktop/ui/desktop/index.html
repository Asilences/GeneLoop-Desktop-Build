<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeneLoop Desktop</title><link rel="stylesheet" href="/desktop/desktop.css"></head><body data-desktop-screen="loading">
<section id="auth" class="auth" hidden><div class="auth-art"><img src="/assets/geneloop-spiral.svg" alt=""><h1>让研究，<br>向前一步。</h1><p>GeneLoop · 研究工作空间</p></div><div class="auth-main"><div class="auth-card"><div class="wordmark"><img src="/assets/geneloop-spiral.svg" alt="">GeneLoop <span>Desktop</span></div><h2 id="auth-title">欢迎回来</h2><p id="auth-description">登录你的工作空间，继续研究。</p><form id="login-form"><label>用户名<input id="login-user" name="username" autocomplete="username" required></label><label id="display-name" hidden>显示名称<input name="displayName" autocomplete="name"></label><label id="invite-code" hidden>邀请码<input name="inviteCode" autocomplete="off"></label><label>密码<input id="login-pass" name="password" type="password" autocomplete="current-password" required></label><button class="primary" id="login-submit">登录</button></form><p id="login-error" class="error" role="alert"></p><button id="auth-toggle" class="link">使用邀请码注册</button><p class="auth-server" id="auth-server"></p></div></div></section>
<section id="loading" class="loading"><img src="/assets/geneloop-spiral.svg" alt=""><h2>正在连接工作空间</h2><p id="loading-message">正在读取服务器状态…</p><button id="connect-retry" class="secondary" hidden>重新连接</button></section>
<section id="workspace" class="workspace" hidden><aside id="sidebar" class="sidebar"><div class="wordmark"><img src="/assets/geneloop-spiral.svg" alt="">GeneLoop <small>Desktop</small></div><button id="new-session" class="new-session">＋ 新会话</button><div class="sidebar-tools"><input id="search" aria-label="搜索对话" placeholder="搜索对话…"></div><div class="workspace-heading"><span>工作区</span><button id="new-workspace" class="icon" title="新建工作区">＋</button></div><nav id="workspace-list" aria-label="工作区和对话"></nav><footer><button id="settings-nav">⚙ 设置</button><button id="account-nav"><span id="account-name">账户</span><span>⌄</span></button></footer></aside>
<main class="conversation"><header class="conversation-header"><button id="sidebar-toggle" class="icon" title="切换侧栏">☷</button><div><h1 id="session-title">新会话</h1><span id="session-status">开始你的研究</span></div><div class="header-actions"><button id="rename-session" class="icon" title="重命名">✎</button><button id="deliveries-toggle" class="icon" title="交付文件">▤</button><button id="refresh-session" class="icon" title="重新连接">↻</button></div></header><div class="tabs"><button id="chat-tab" class="selected">对话</button><button id="trace-tab">轨迹</button></div><div id="connection-warning" class="connection-warning" hidden></div><section id="history" class="history"><div class="welcome" id="welcome"><img src="/assets/geneloop-spiral.svg" alt=""><h2>探索未至之境</h2><p>把资料、想法和下一步，连接起来。</p><div id="welcome-scenes" class="scene-cards"></div></div></section><section id="questions" class="questions" hidden></section><div class="composer-wrap"><div id="attachments" class="attachments"></div><form id="composer" class="composer"><textarea id="prompt" rows="2" placeholder="发消息或创建任务" aria-label="发送消息"></textarea><div class="composer-toolbar"><button id="attach" type="button" class="icon" title="上传文件副本">＋</button><input id="file-input" type="file" multiple hidden><button id="scene-select" class="scene-trigger" type="button" aria-label="场景" aria-haspopup="listbox" aria-expanded="false">Chat</button><button id="scene-options" type="button" class="subtle">选项</button><div class="model-controls"><select id="model-select" aria-label="模型"></select><select id="effort-select" aria-label="推理强度"></select></div><button id="stop" type="button" class="stop" hidden>停止</button><button id="send" class="send" aria-label="发送">↑</button></div></form><div class="composer-caption" id="composer-caption">文件和任务在所连接的 GeneLoop 服务器执行</div></div></main><aside id="deliveries" class="deliveries" hidden><header><h2>交付文件</h2><button id="deliveries-close" class="icon">×</button></header><div id="delivery-list"></div><section id="preview" class="preview"></section></aside></section>
<div id="toast" class="toast" hidden role="status"></div><script type="module" src="/desktop/app.js"></script></body></html>
